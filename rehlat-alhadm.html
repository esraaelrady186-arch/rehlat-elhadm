<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الهضم – مغامرة داخل جسم الإنسان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b0f4d;--p:#8e44ff;--pk:#ff4fa3;--y:#ffd23f;--c:#35d0ff;--card:#fff3ff;--ink:#2a1560;--a:#ff4fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Cairo',Tahoma,sans-serif;color:#fff;background:radial-gradient(circle at 20% 8%,var(--a),transparent 45%),radial-gradient(circle at 85% 90%,#2a7bff55,transparent 50%),linear-gradient(160deg,#2b1370,#150a3d 70%);background-color:var(--bg);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,#ffd23f,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(2px 2px at 60px 180px,#9ff,transparent);background-size:200px 200px;opacity:.55;animation:tw 4s infinite alternate}
@keyframes tw{to{opacity:.2}}
#hud{position:sticky;top:0;z-index:5;padding:8px 10px;background:#1b0f4dd9;backdrop-filter:blur(6px);border-bottom:2px solid #ff4fa366}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:820px;margin:auto}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(#ffd23f,#ff9f1c);display:grid;place-items:center;font-size:26px;border:3px solid #fff}
.chip{background:#ffffff1f;border-radius:14px;padding:3px 10px;font-weight:700;font-size:14px}
.pb{flex:1;min-width:90px;height:12px;background:#ffffff30;border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#35d0ff,#ffd23f);transition:width .5s}
.hb{background:#ffffff22;border:0;color:#fff;border-radius:12px;padding:4px 9px;font:700 13px Cairo;cursor:pointer}
main{max-width:820px;margin:auto;padding:14px;position:relative;z-index:1}
.center{text-align:center}
h1{font-size:clamp(34px,8vw,60px);margin:6px 0;color:var(--y);text-shadow:0 4px 0 #b3267a,0 8px 18px #0006;font-weight:900}
h2{color:var(--y);text-shadow:0 3px 0 #b3267a;margin:6px 0}
.btn{font:900 20px Cairo;color:#fff;border:0;border-radius:20px;padding:12px 30px;cursor:pointer;background:linear-gradient(#ff6fb8,#ff3d8f);box-shadow:0 7px 0 #a01b5c,0 12px 20px #0005;transition:.08s;margin:6px}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #a01b5c}.btn.g{background:linear-gradient(#5be37d,#1fb855);box-shadow:0 7px 0 #0e7a35,0 12px 20px #0005}.btn.b{background:linear-gradient(#52c7ff,#2a7bff);box-shadow:0 7px 0 #1a4fb0,0 12px 20px #0005}.btn[disabled]{filter:grayscale(1);opacity:.5;pointer-events:none}
.card{background:var(--card);color:var(--ink);border:5px solid var(--pk);border-radius:26px;padding:16px;box-shadow:0 10px 30px #0006;animation:pop .4s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.hero{width:min(210px,40vw);animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
.row{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap}
.qh{display:flex;justify-content:space-between;font-weight:900;color:var(--p);gap:8px}
.qt{font-size:clamp(20px,4.6vw,28px);font-weight:900;margin:12px 0;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{font:900 clamp(17px,4vw,22px) Cairo;border:0;border-radius:18px;padding:12px;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0004;transition:.1s}
.opt:nth-child(1){background:#2a7bff}.opt:nth-child(2){background:#ff9f1c}.opt:nth-child(3){background:#9b4dff}
.opt.ok{background:#1fb855!important;animation:bn .6s}.opt.no{background:#8a8a99!important;opacity:.6;text-decoration:line-through}.opt:active{transform:translateY(4px)}
.tf{grid-template-columns:1fr 1fr}.tf .opt:nth-child(1){background:#1fb855}.tf .opt:nth-child(2){background:#ef3b4f}
@keyframes bn{50%{transform:scale(1.07)}}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.shake{animation:sh .35s}
.meta{margin-top:10px;font-weight:700;font-size:14px;color:#6b4aa8}
.fb{margin-top:10px;border-radius:16px;padding:10px 14px;font-weight:700;font-size:17px;line-height:1.7}.fb.ok{background:#d9ffe4;color:#0b6b2c}.fb.no{background:#fff0d6;color:#8a4b00}.fb.end{background:#ffe0e6;color:#9c1f3a}
.mp{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.nd{display:flex;gap:10px;align-items:center;background:#ffffff18;border:3px solid #ffffff55;border-radius:22px;padding:10px;cursor:pointer;color:#fff;font:700 15px Cairo;text-align:right}
.nd.cu{border-color:var(--y);box-shadow:0 0 18px var(--y);animation:bn 2s infinite}.nd.lk{filter:grayscale(1);opacity:.55;cursor:not-allowed}.nd.dn{border-color:#5be37d}
.nd img{width:84px}.nd b{font-size:18px;display:block;color:var(--y)}
.bg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bc{background:#ffffff18;border-radius:20px;padding:10px;text-align:center;font-size:13px}.bc img{width:100%;max-width:150px}.bc.x img,.bc.x .fb2{filter:grayscale(1) brightness(.6);opacity:.6}
.fb2{width:110px;height:110px;margin:auto;border-radius:50%;display:grid;place-items:center;font-size:56px;background:radial-gradient(#ffe27a,#ff9f1c);border:6px solid #fff}
.lb{display:flex;align-items:center;gap:10px;background:#ffffff1c;border-radius:16px;padding:8px 12px;margin:7px 0;font-weight:700}.lb .n{flex:1}.lb small{display:block;opacity:.8;font-weight:500}.lb.t1{background:#ffd23f44}.lb.t2{background:#cfd8e655}.lb.t3{background:#cd7f3255}.md{font-size:30px;width:38px;text-align:center}
.bd{position:relative;width:min(340px,100%);margin:8px auto}.bd img{width:100%;display:block}
.sl{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:#fff;border:3px dashed var(--p);color:var(--p);font:900 11px Cairo;display:grid;place-items:center;cursor:pointer;white-space:nowrap;z-index:2}.sl.ok{background:#1fb855;color:#fff;border:3px solid #fff;animation:bn .5s}
.bk{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.ch{font:900 16px Cairo;border:0;border-radius:16px;padding:9px 16px;color:#fff;cursor:grab;box-shadow:0 5px 0 #0004}.ch.sel{outline:4px solid var(--y);transform:scale(1.08)}.ch.used{opacity:.4}
.cl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.col{border:4px dashed var(--p);border-radius:18px;min-height:130px;padding:8px;text-align:center;font-weight:900;cursor:pointer;background:#fff}.col .ch{display:block;margin:6px 0;width:100%}
.dec{position:fixed;width:52px;opacity:.9;pointer-events:none;animation:fl 5s infinite;z-index:0}
.cf{position:fixed;top:-30px;font-size:26px;z-index:20;pointer-events:none;animation:fa 3s linear forwards}@keyframes fa{to{transform:translateY(110vh) rotate(540deg)}}
.bub{background:#fff;color:var(--ink);border-radius:20px;padding:12px 16px;font-weight:700;line-height:1.8;max-width:420px;box-shadow:0 6px 0 #0003}
#cert{display:none}
.cert{background:#fffdf3;color:#5b3a00;border:12px double #c98a00;border-radius:12px;padding:24px;text-align:center}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;top:0;left:0;right:0;margin:0}body:before,.dec{display:none}}
</style>
</head>

function orgTask(){sel=null;go('org',`<div class=card><div class=qh><span>🧭 مهمة تحديد الأعضاء</span><span>10 نقاط</span></div><div class=qt style="font-size:20px">اختر اسم العضو ثم اضغط مكانه الصحيح على المجسم (أو اسحبه إليه)</div><div class=bd style="width:min(360px,100%)"><img src="${IMG.body}" alt="">${POS.map((p,i)=>`<div class=sl id=s${i} style="left:${p[0]}%;top:${p[1]}%" onclick=plO(${i}) ondragover="event.preventDefault()" ondrop="plO(${i})">؟</div>`).join('')}</div><div class=bk id=bk>${ORG.map((o,i)=>`<button class=ch id=c${i} draggable=true style="background:${COL[i]}" ondragstart="sel=${i}" onclick="sel=${i};hl()">${o}</button>`).join('')}</div><div id=fb></div><div id=nx class=center></div></div>`,'#35d0ff')}
function hl(){document.querySelectorAll('.ch').forEach(c=>c.classList.remove('sel'));const c=$('#c'+sel);c&&c.classList.add('sel')}
function plO(i){if(sel===null)return fb('no','اختر اسم عضو أولًا! 👆');const s=$('#s'+i);if(s.classList.contains('ok'))return;if(sel===i){s.textContent=ORG[i];s.classList.add('ok');const c=$('#c'+sel);c.classList.add('used');c.disabled=true;sel=null;sfx('ok');fb('ok','صح! ✅');if(document.querySelectorAll('.sl.ok').length===6)taskEnd('org','nav',`ممتاز يا ${S.n}! حصلت على شارة ملاح القناة`)}else{s.classList.add('shake');setTimeout(()=>s.classList.remove('shake'),400);sfx('no');fb('no',`${ORG[sel]} ليس في هذا المكان، فكّر في موقعه من مسار الطعام وحاول مرة تانية 💪`)}}
let sp=[],sv=null;
function sortTask(){sel=null;sv=null;sp=[null,null,null,null];go('sort',`<div class=card><div class=qh><span>⚖️ مهمة الفرز والمقارنة</span><span>10 نقاط</span></div><div class=qt style="font-size:20px">اختر الوظيفة ثم اضغط العمود المناسب (أو اسحبها إليه). بعد ما تفرز الكل اضغط «تأكيد الإجابة».</div><div id=sa></div><div id=fb></div><div id=nx class=center></div></div>`,'#9b4dff');sr()}
function chp(i){return `<button class="ch${sel===i?' sel':''}" draggable=${!sv} style="background:${COL[i]}" ondragstart="sel=${i}" onclick="event.stopPropagation();${sv?'':`sel=sel===${i}?null:${i};sr()`}">${sv?(sv[i]?'✅ ':'❌ '):''}${SRT[i][0]}</button>`}
function sr(){$('#sa').innerHTML=`<div class=cl>${COLN.map((n,k)=>`<div class=col onclick="plS(${k})" ondragover="event.preventDefault()" ondrop="plS(${k})" style="color:${k?'#9b4dff':'#1a9d8a'}">${n}${sp.map((c,i)=>c===k?chp(i):'').join('')}</div>`).join('')}</div><div class=bk onclick="plS(-1)" ondragover="event.preventDefault()" ondrop="plS(-1)">${sp.map((c,i)=>c===null?chp(i):'').join('')}</div>`;if(!sv)$('#nx').innerHTML=sp.every(c=>c!==null)?`<button class="btn g" onclick=sconf()>✔️ تأكيد الإجابة</button>`:''}
function plS(k){if(sv||sel===null)return;sp[sel]=k<0?null:k;sel=null;sfx('start');sr()}
function sconf(){sv=sp.map((c,i)=>c===SRT[i][1]);sr();const bad=sv.map((x,i)=>x?-1:i).filter(i=>i>=0);if(!bad.length)return taskEnd('sort','hero',`إجابتك صحيحة ✅ ممتاز يا ${S.n}! حصلت على شارة بطل رحلة الهضم`);sfx('no');fb('no','بعض التصنيفات غير صحيحة ❌<br>'+bad.map(i=>`«${SRT[i][0]}» من وظائف ${COLN[SRT[i][1]]}`).join('<br>'));$('#nx').innerHTML=`<button class="btn b" onclick=sortTask()>🔁 حاول مرة تانية</button>`}
/* ===== الشارات والمتصدرون والنهاية ===== */
function bdg(){go('bdg',`<h2 class=center>🎖️ شاراتي (${S.bd.length} من 9)</h2><div class=bg>${BD.map(b=>{const g=S.bd.includes(b.k);return`<div class="bc ${g?'':'x'}">${bimg(b.k)}<b>${b.n}</b><br>${b.l}<br><small>${b.d}</small><br><b>${g?'✅ مكتسبة':'🔒 لم تكتسب بعد'}</b></div>`}).join('')}</div>`)}
function lb(){const L=getBoard().sort((a,b)=>(b.p||0)-(a.p||0)||(b.l||0)-(a.l||0)),M=['🥇','🥈','🥉'];go('lb',`<h2 class=center>🏆 قائمة المتصدرين</h2><p class=center style="font-size:13px">${DB?'لوحة مشتركة بين الأجهزة':'النتائج محفوظة على هذا الجهاز'}</p>${L.length?L.map((e,i)=>`<div class="lb ${i<3?'t'+(i+1):''}"><span class=md>${M[i]||i+1}</span><div class=av>${e.g==='b'?'👦':'👧'}</div><div class=n>${esc(e.n)}<small>${e.l||0} مستويات · ${e.b||0} شارات</small></div><b>⭐ ${e.p||0}</b></div>`).join(''):'<p class=center>لا توجد نتائج بعد. كن أول المتصدرين!</p>'}<div class=center><button class="btn b" onclick="S&&S.n&&cur!=='cover'?map():cover()">رجوع</button></div>`)}
function fin(){const rank=getBoard().sort((a,b)=>(b.p||0)-(a.p||0)).findIndex(e=>e.n===S.n&&e.g===S.g)+1,tot=Object.keys(S.fin).length;sfx('win');conf();speak(`مبروك يا ${S.n}! لقد أصبحت ${H()} رحلة الهضم`);
go('fin',`<div class="card center"><h1 style="font-size:clamp(26px,6vw,42px)">🎉 مبروك! لقد أصبحت ${H()} رحلة الهضم</h1><div class=av style="width:80px;height:80px;font-size:50px;margin:auto">${S.g==='b'?'👦':'👧'}</div><h2 style="color:var(--p);text-shadow:none">${esc(S.n)}</h2><div class=chip style="color:var(--ink);background:#ffe9fb;display:block;font-size:18px;line-height:2">⭐ النقاط: ${S.pts}<br>المستويات المكتملة: ${S.done.filter(x=>x).length} من 7<br>الشارات: ${S.bd.length} من 9<br>الإجابات الصحيحة: ${S.corr} من 35<br>نسبة الإنجاز: ${Math.round(tot/37*100)}%<br>الترتيب: ${rank||'—'}</div><div class=bg style="margin-top:10px">${S.bd.map(k=>`<div class=bc style="color:var(--ink)">${bimg(k,80)}</div>`).join('')}</div><button class="btn g" onclick=cert()>📜 شهادة الإنجاز</button><button class=btn onclick=again()>🔁 العب مرة أخرى</button><button class="btn b" onclick=bdg()>🎖️ عرض الشارات</button><button class="btn b" onclick=lb()>🏆 قائمة المتصدرين</button></div>`)}
function cert(){const f=S.g!=='b';go('cert',`<div class=cert><h1 style="color:#b3730b;text-shadow:none">شهادة إنجاز</h1><p style="font-size:22px">تشهد لعبة «رحلة الهضم» بأن</p><h2 style="font-size:40px;color:#7a2fd0;text-shadow:none">${esc(S.n)}</h2><p style="font-size:22px;line-height:2">أتمّ${f?'ت':''} رحلة الهضم بنجاح، وجمع${f?'ت':''} ${S.pts} نقطة و${S.bd.length} شارات، وأجاب${f?'ت':''} إجابة صحيحة عن ${S.corr} من 35 سؤالًا.</p><p style="font-size:30px">🏅 ${H()} رحلة الهضم 🏅</p><p>${new Date().toLocaleDateString('ar-EG')}</p></div><div class=center><button class="btn g" onclick=certPng()>📥 احفظ شهادتك (صورة للطباعة)</button><button class="btn" onclick="try{window.print()}catch(e){}">🖨️ اطبع</button><button class="btn b" onclick=fin()>رجوع</button><div id=cm style="font-weight:700"></div></div>`)}
async function certPng(){const m=$('#cm');try{const dl=typeof claude!=='undefined'&&await claude.use('downloads');if(!dl){m.textContent='الحفظ غير متاح هنا، جرّب زر الطباعة.';return}try{await document.fonts.load('900 40px Cairo')}catch(e){}
const c=document.createElement('canvas');c.width=1600;c.height=1130;const x=c.getContext('2d');x.direction='rtl';x.textAlign='center';x.fillStyle='#fffdf3';x.fillRect(0,0,1600,1130);x.strokeStyle='#c98a00';x.lineWidth=16;x.strokeRect(30,30,1540,1070);x.lineWidth=4;x.strokeRect(62,62,1476,1006);
const T=(t,y,z,k)=>{x.font=`900 ${z}px Cairo,Tahoma,sans-serif`;x.fillStyle=k;x.fillText(t,800,y)},f=S.g!=='b'?'ت':'';
T('شهادة إنجاز',190,110,'#b3730b');T('تشهد لعبة «رحلة الهضم» بأن',300,50,'#5b3a00');T(S.n,420,100,'#7a2fd0');T(`أتمّ${f} رحلة الهضم بنجاح، وجمع${f} ${S.pts} نقطة و${S.bd.length} شارات،`,520,44,'#5b3a00');T(`وأجاب${f} إجابة صحيحة عن ${S.corr} من 35 سؤالًا.`,585,44,'#5b3a00');
const im=new Image();im.src=IMG.hero;await im.decode();x.drawImage(im,665,625,270,284);T(`${H()} رحلة الهضم`,980,50,'#b3730b');T(new Date().toLocaleDateString('ar-EG'),1042,30,'#5b3a00');
const b=await new Promise(r=>c.toBlob(r,'image/png'));await dl.save({filename:'certificate.png',data:b});m.textContent='تم حفظ الشهادة ✅ افتحها واطبعها.'}catch(e){m.textContent='لم يتم الحفظ، حاول مرة تانية أو استخدم زر الطباعة.'}}
function again(){S=Object.assign(fresh(S.n,S.g));save();saveBoard();map()}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
document.addEventListener('click',()=>ac(),{once:true});
cover();
</script>
</body>
</html>
